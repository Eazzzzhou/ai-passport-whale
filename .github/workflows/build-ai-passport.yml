name: Build AI Passport (zh-CN)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build ai-passport
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          python scripts/build.py folotoy/ai-passport --name ai-passport --language zh-CN --wake-word disabled

      - name: Upload merged binary
        uses: actions/upload-artifact@v7
        with:
          name: ai-passport-zh
          path: build/merged-binary.bin
          if-no-files-found: error
